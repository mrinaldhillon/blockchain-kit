name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: tests/run
        run: tests/run
      - name: shellcheck
        run: shellcheck bin/blockchain-kit-setup bin/blockchain-kit-update lib/blockchain-kit-homes.sh tests/run
      - name: ruff
        # bin/ and hooks/ hold extensionless Python that ruff's default include skips
        run: pipx run ruff==0.16.5 check lib tests $(grep -lE '^#!.*python' bin/* hooks/*) # prediction-bot's pin
      - name: claude plugin validate
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate .
